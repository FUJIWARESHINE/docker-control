# Docker Control — 全新重构版
# 部署：把本文件传到服务器，docker compose up -d，访问 http://<IP>:9527
#
# 镜像 tag 说明（自动构建，多架构 amd64/arm64）：
#   :latest        最新发布版（推荐，跟随每次打 tag 的版本）
#   :v1.0.1        精确版本，可锁定不回退
#   :edge          主线开发版，含未发布改动（尝鲜用）
#   锁定版本：在 .env 里写 DC_TAG=v1.0.1，或直接改下面 image 行的 tag
services:
  docker-control:
    image: ghcr.io/fujiwareshine/docker-control:${DC_TAG:-latest}   # 默认跟随最新发布版
    container_name: docker-control
    restart: always
    network_mode: host              # host 网络：端口页完整功能（/proc/net 扫描宿主机全端口）
    # ports:                        # ← 如改回 bridge 网络则取消注释，同时注释上一行
    #   - "9527:9527"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # 必需：Docker Engine API
      - ./data:/app/data             # 密码/配置/定时任务持久化
      # ---- Compose 项目目录（窄挂载）----------------------------------------
      # 只挂载 compose 文件所在的父目录，且「同路径挂载」：
      # 容器内路径与宿主机完全一致，面板可直接读写，无需任何路径转换。
      # 请把 ${COMPOSE_DIR} 改成你自己的 compose 项目根目录，例如：
      #   NAS/群晖：  /volume1/docker
      #   软路由/OpenWrt：/opt/docker
      #   普通 Linux： /srv/docker
      # 多个目录用多行依次添加即可。
      - ${COMPOSE_DIR:-/srv/docker}:${COMPOSE_DIR:-/srv/docker}:rw
    environment:
      - TZ=Asia/Shanghai
      # Compose 读写根目录（多个用英文冒号分隔）。面板只在这些目录下读写 compose 文件。
      - COMPOSE_DIRS=${COMPOSE_DIR:-/srv/docker}
    security_opt:
      - no-new-privileges:true
    labels:
      - docker-control.self=true    # 自保护标记：面板自身容器从容器列表剔除（防误操作）
# ============================================================================
# 关于 Compose 文件读写的权限说明
#
# 用途：Compose 项目的「编辑」功能需要读写宿主机上的 docker-compose.yml。
#       面板跑在容器里，不挂载的话 os.ReadFile(宿主机路径) 会直接 ENOENT。
#
# 本配置采用「窄挂载」：只把 compose 项目根目录挂进来，宿主机其余文件
# 容器内完全不可见。相比直接挂 /:/host:rw，权限面小得多。
#
# 部署步骤：
#   1. 设置环境变量 COMPOSE_DIR 指向你的 compose 项目根目录，例如
#        COMPOSE_DIR=/volume1/docker docker compose up -d
#      或直接修改本文件里两处 ${COMPOSE_DIR:-/srv/docker} 为绝对路径。
#   2. 确保该目录下每个项目各有一个 docker-compose.yml。
#   3. 面板会自动识别路径（同路径挂载，无需 HOST_ROOT 前缀）。
#
# 如果不需要 Compose 编辑功能，把 volumes 里那一行和 COMPOSE_DIRS 删掉即可。
#
# 兼容旧配置：若仍想用「根目录 + /host 前缀」的方式，可改为
#       - /:/host:rw
#   并设置 HOST_ROOT=/host，面板同样支持（通过 HOST_ROOT 做路径映射）。
# ============================================================================
